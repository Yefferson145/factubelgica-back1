# Perfil exclusivo de pruebas automatizadas.
# No se conecta a Supabase ni a ninguna base real: usa H2 en memoria.
spring:
  datasource:
    url: jdbc:h2:mem:factubelgica;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,ROLE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Valor SOLO para pruebas. No es el secreto de produccion.
    secret: ${JWT_SECRET_KEY:test-only-jwt-secret-key-that-is-at-least-32-bytes-long}
  cookie:
    secure: false
    same-site: Lax
