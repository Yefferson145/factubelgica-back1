spring:
  application:
    name: api
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cookie:
    # En local (HTTP) debe ser false. En produccion (HTTPS) usar COOKIE_SECURE=true.
    secure: ${COOKIE_SECURE:false}
    # En local usar Lax. En produccion con frontend en otro dominio: COOKIE_SAME_SITE=None
    same-site: ${COOKIE_SAME_SITE:Lax}

springdoc:
  packages-to-scan: com.factubelgica.api.contexts
  swagger-ui:
    path: /api-docs
  api-docs:
    path: /api-spec